<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream en Vivo</title>
    <script src="/hls.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .container { width: 100%; max-width: 900px; }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 300;
            font-size: 1.8rem;
        }
        .video-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            aspect-ratio: 16/9;
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
        }
        .status {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .status.live { color: #6bcb77; }
        .status.offline { color: #ff6b6b; }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        .live .dot { background: #6bcb77; }
        .offline .dot { background: #ff6b6b; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }
        .info {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.8;
        }
        .info p { margin: 5px 0; }
        .info strong { color: #6bcb77; }
        .info code {
            background: rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stream en Vivo</h1>
        <div class="video-container">
            <video id="video" controls autoplay muted playsinline></video>
        </div>
        <div id="status" class="status offline">
            <span class="dot"></span>
            <span id="statusText">Esperando stream...</span>
        </div>
        <div class="info" id="info"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const info = document.getElementById('info');
        const streamUrl = '/hls/stream.m3u8';

        // Mostrar info de conexión
        const serverIP = window.location.hostname;
        info.innerHTML = `
            <p><strong>Para transmitir desde OBS:</strong></p>
            <p>Servidor: <code>rtmp://${serverIP}/live</code></p>
            <p>Clave de stream: <code>stream</code></p>
        `;

        function updateStatus(isLive) {
            status.className = 'status ' + (isLive ? 'live' : 'offline');
            statusText.textContent = isLive ? 'EN VIVO' : 'Esperando stream...';
        }

        function initPlayer() {
            if (Hls.isSupported()) {
                const hls = new Hls({
                    liveDurationInfinity: true,
                    liveBackBufferLength: 0,
                    maxBufferLength: 10,
                    maxMaxBufferLength: 30
                });

                hls.loadSource(streamUrl);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    updateStatus(true);
                    video.play().catch(() => {});
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        updateStatus(false);
                        hls.destroy();
                        setTimeout(initPlayer, 3000);
                    }
                });

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari nativo
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => {
                    updateStatus(true);
                    video.play().catch(() => {});
                });
                video.addEventListener('error', () => {
                    updateStatus(false);
                    setTimeout(initPlayer, 3000);
                });
            } else {
                statusText.textContent = 'Navegador no compatible';
            }
        }

        initPlayer();
    </script>
</body>
</html>
